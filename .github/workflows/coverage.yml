name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: pytest --cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        # Uses the pinned Python (.python-version → 3.14).
        run: uv sync --frozen

      - name: Run tests with coverage
        # Fails the job if total coverage drops below the threshold.
        run: |
          uv run pytest packages/vector_search/test \
            --cov=packages/vector_search/src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
